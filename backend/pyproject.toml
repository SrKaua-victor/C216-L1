[project]
name = "backend"
version = "0.1.0"
description = "Backend do projeto C216-L1"
authors = [
    {name = "SrKaua-victor",email = "kauavictorgarciasiecola567@hotmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.1.5,<3.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.1,<0.18.0)"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["F401"]
"migrations/versions/*.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: testes unitarios, executam service e schemas diretamente, sem HTTP",
    "integration: testes de integracao, executam os endpoints via TestClient",
]
