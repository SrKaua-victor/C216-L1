name: CI Frontend

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint do frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Faz o checkout do repositorio
        uses: actions/checkout@v4

      - name: Configura o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependencias
        run: npm ci

      - name: Verifica lint e formatacao
        run: npx biome ci --error-on-warnings .

  test:
    name: Testes do frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Faz o checkout do repositorio
        uses: actions/checkout@v4

      - name: Configura o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependencias
        id: install
        run: npm ci

      - name: Executa os testes unitarios
        run: npm run test:unit

      - name: Executa os testes de integracao
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:integration

      - name: Gera o build de producao
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Instala o navegador do Playwright
        id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      - name: Executa os testes end-to-end
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npm run test:e2e

      - name: Anexa o relatorio do Playwright
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
