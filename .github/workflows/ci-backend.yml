name: CI Backend

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint do backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Faz o checkout do repositorio
        uses: actions/checkout@v4

      - name: Instala o Poetry
        run: pipx install poetry==2.4.1

      - name: Configura o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Instala as dependencias
        id: install
        run: poetry install --no-root

      - name: Verifica o lint
        run: poetry run ruff check .

      - name: Verifica a formatacao
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: poetry run ruff format --check .

  test:
    name: Testes do backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: c216_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d c216_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/c216_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/c216_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Faz o checkout do repositorio
        uses: actions/checkout@v4

      - name: Instala o Poetry
        run: pipx install poetry==2.4.1

      - name: Configura o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Verifica o pyproject.toml
        run: poetry check

      - name: Instala as dependencias
        id: install
        run: poetry install --no-root

      - name: Aplica as migrations no PostgreSQL
        run: poetry run alembic upgrade head

      - name: Verifica se as migrations correspondem aos modelos
        run: poetry run alembic check

      - name: Executa os testes unitarios
        run: poetry run pytest -m unit -v

      - name: Executa os testes de integracao
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: poetry run pytest -m integration -v

  compose:
    name: Aplicacao completa via Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Faz o checkout do repositorio
        uses: actions/checkout@v4

      - name: Sobe db, api e frontend
        run: make up-build

      - name: Confere que os tres servicos estao saudaveis
        run: |
          docker compose ps
          test "$(docker compose ps --format '{{.Service}}={{.Health}}' | sort | tr '\n' ' ')" \
            = "api=healthy db=healthy frontend=healthy "

      - name: Aplica as migrations e confere a versao atual
        run: |
          make db-upgrade
          make db-current | tee versao.txt
          grep -q "(head)" versao.txt

      - name: Cria um usuario e um item no PostgreSQL
        run: |
          curl -fsS http://localhost:8000/health
          USER_ID=$(curl -fsS -X POST http://localhost:8000/users \
            -H "Content-Type: application/json" \
            -d '{"nome": "Ana", "email": "ana@email.com"}' | jq -r .id)
          curl -fsS "http://localhost:8000/users/$USER_ID"
          echo "USER_ID=$USER_ID" >> "$GITHUB_ENV"
          curl -fsS -X POST http://localhost:8000/items/ \
            -H "Content-Type: application/json" \
            -d '{"nome": "Caderno", "descricao": "Capa dura"}'

      - name: Verifica a persistencia apos reiniciar a api
        run: |
          docker compose restart api
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors "http://localhost:8000/users/$USER_ID" \
            | jq -e '.email == "ana@email.com"'
          curl -fsS http://localhost:8000/items/ | jq -e 'map(.nome) == ["Caderno"]'

      - name: Verifica o frontend servido pelo Nginx
        run: curl -fsS http://localhost:5173 | grep -q "<title>C216 L1 - Cadastro de itens</title>"

      - name: Verifica o CORS entre o frontend e a api
        run: |
          curl -fsS -o /dev/null -D cabecalhos.txt -X OPTIONS http://localhost:8000/items/ \
            -H "Origin: http://localhost:5173" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type"
          grep -qi "^access-control-allow-origin: http://localhost:5173" cabecalhos.txt
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS http://localhost:8000/items/ \
            -H "Origin: http://site-desconhecido.example" \
            -H "Access-Control-Request-Method: POST")
          test "$STATUS" = "400"

      - name: Mostra os logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derruba os containers
        if: always()
        run: docker compose down -v
